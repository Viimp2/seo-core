<body>
<title>Семантическое ядро roomora.ai</title>
<style id="app-css">
:root{
  --bg:#FBFAF7; --bg-soft:#F5F2EC; --surface:#FFFFFF;
  --ink:#11151E; --ink-2:#3F4756; --ink-3:#6B7382;
  --line:rgba(17,21,30,.09); --line-2:rgba(17,21,30,.05);
  --accent:#F25C2B; --accent-soft:rgba(242,92,43,.10); --accent-bar:rgba(242,92,43,.13);
  --pick:rgba(242,92,43,.055);
  --shadow:0 1px 0 rgba(17,21,30,.04), 0 4px 12px rgba(60,40,25,.05), 0 24px 48px rgba(60,40,25,.045);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0E1A; --bg-soft:#0C1120; --surface:#0F1729;
  --ink:#F1F5FB; --ink-2:#B4BECD; --ink-3:#8792A4;
  --line:rgba(241,245,251,.12); --line-2:rgba(241,245,251,.06);
  --accent:#FF7A4D; --accent-soft:rgba(255,122,77,.14); --accent-bar:rgba(255,122,77,.16);
  --pick:rgba(255,122,77,.07);
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.34), 0 24px 56px rgba(0,0,0,.34);
}}
:root[data-theme="dark"]{
  --bg:#0A0E1A; --bg-soft:#0C1120; --surface:#0F1729;
  --ink:#F1F5FB; --ink-2:#B4BECD; --ink-3:#8792A4;
  --line:rgba(241,245,251,.12); --line-2:rgba(241,245,251,.06);
  --accent:#FF7A4D; --accent-soft:rgba(255,122,77,.14); --accent-bar:rgba(255,122,77,.16);
  --pick:rgba(255,122,77,.07);
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.34), 0 24px 56px rgba(0,0,0,.34);
}
:root[data-theme="light"]{
  --bg:#FBFAF7; --bg-soft:#F5F2EC; --surface:#FFFFFF;
  --ink:#11151E; --ink-2:#3F4756; --ink-3:#6B7382;
  --line:rgba(17,21,30,.09); --line-2:rgba(17,21,30,.05);
  --accent:#F25C2B; --accent-soft:rgba(242,92,43,.10); --accent-bar:rgba(242,92,43,.13);
  --pick:rgba(242,92,43,.055);
  --shadow:0 1px 0 rgba(17,21,30,.04), 0 4px 12px rgba(60,40,25,.05), 0 24px 48px rgba(60,40,25,.045);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- header ---------- */
.masthead{padding:56px 0 26px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}
h1{font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.04em;margin:18px 0 0;
  font-weight:640;text-wrap:balance;max-width:15ch}
h1 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em}
.lede{margin:16px 0 0;max-width:58ch;color:var(--ink-2);font-size:16.5px;line-height:1.55}
.meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-3)}
.meta b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- briefing ---------- */
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:34px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;
  box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:15px;letter-spacing:-.01em;font-weight:640}
.card p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.55}
.card .big{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--accent);
  display:block;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums}

.note{background:var(--bg-soft);border:1px solid var(--line-2);border-radius:14px;
  padding:18px 22px;margin:16px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.note b{color:var(--ink)}

/* ---------- sticky bar ---------- */
.bar{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line);margin-top:38px}
.bar-in{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--bg-soft);border:1px solid var(--line-2);
  border-radius:999px;padding:3px}
.tab{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:13px;font-weight:600;
  padding:6px 15px;border-radius:999px;cursor:pointer;transition:color .2s cubic-bezier(.22,1,.36,1)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,21,30,.09)}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:9px 16px 9px 36px;font:inherit;font-size:13.5px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;
  font-weight:560;padding:8px 15px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;
  gap:7px;transition:box-shadow .2s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1)}
.btn:hover{box-shadow:0 2px 8px rgba(17,21,30,.10)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tally{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tally b{font-size:16px;color:var(--ink);font-weight:640}
.tally .acc{color:var(--accent)}

/* ---------- ledger ---------- */
.cluster{margin:44px 0 0}
.cluster-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:2px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.cluster-letter{font-family:var(--serif);font-style:italic;font-size:34px;line-height:.9;
  color:transparent;-webkit-text-stroke:1px var(--ink-3);flex:none;width:38px;padding-top:2px}
.cluster-head h2{margin:0;font-size:19px;letter-spacing:-.02em;font-weight:640}
.cluster-head p{margin:5px 0 0;color:var(--ink-3);font-size:13px;max-width:66ch;line-height:1.5}
.cluster-sum{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.cluster-sum b{display:block;font-size:15px;color:var(--ink-2);font-weight:640}

.colhead{display:grid;align-items:center;gap:12px;padding:9px 12px 7px;
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.row{display:grid;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
  position:relative;cursor:pointer;isolation:isolate;
  transition:background .18s cubic-bezier(.22,1,.36,1)}
.colhead,.row{grid-template-columns:22px minmax(150px,1.5fr) 86px 86px 62px 74px minmax(0,1.35fr)}
.row+.row{box-shadow:inset 0 1px 0 var(--line-2)}
.row::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:11px;
  background:linear-gradient(90deg,var(--accent-bar),transparent);
  width:var(--bar,0%);opacity:.55;transition:opacity .2s}
.row:hover{background:var(--bg-soft)}
.row.picked{background:var(--pick);box-shadow:inset 2px 0 0 var(--accent)}
.row.picked::before{opacity:.85}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.box{width:19px;height:19px;border:1.5px solid var(--ink-3);border-radius:6px;flex:none;
  display:grid;place-items:center;transition:all .2s cubic-bezier(.22,1,.36,1)}
.row.picked .box{background:var(--accent);border-color:var(--accent)}
.box svg{opacity:0;transform:scale(.6);transition:all .2s cubic-bezier(.22,1,.36,1)}
.row.picked .box svg{opacity:1;transform:scale(1)}
.kw{font-size:14.5px;letter-spacing:-.006em;overflow-wrap:anywhere}
.row.picked .kw{font-weight:600}
.num{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink-2);text-align:right}
.num.lead{color:var(--ink);font-weight:600}
.num.mute{color:var(--ink-3);font-size:12.5px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink-3);text-align:center;justify-self:start;white-space:nowrap}
.chip.hi{border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.rnote{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.rnote em{font-style:normal;color:var(--accent);font-weight:560}

.empty{padding:40px 12px;color:var(--ink-3);font-size:14px}

/* ---------- footer sections ---------- */
.section{margin:60px 0 0}
.section h2{font-size:24px;letter-spacing:-.03em;margin:0 0 6px;font-weight:640}
.section h2 em{font-family:var(--serif);font-style:italic;font-weight:400}
.section > p{color:var(--ink-2);max-width:64ch;margin:0 0 20px;font-size:14.5px}
.maplist{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:14px;overflow:hidden}
.maprow{display:grid;grid-template-columns:minmax(140px,1fr) minmax(120px,1.4fr) 92px;gap:14px;
  background:var(--surface);padding:13px 18px;align-items:center;font-size:13.5px}
.maprow code{font-size:13px;color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.maprow span{color:var(--ink-3)}
.maprow b{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.maprow.head{background:var(--bg-soft);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.maprow.head b{color:var(--ink-3);font-weight:500}

footer{margin:70px 0 90px;padding-top:26px;border-top:1px solid var(--line);
  color:var(--ink-3);font-size:12.5px;line-height:1.6}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:90;
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:all .3s cubic-bezier(.22,1,.36,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .colhead,.row{grid-template-columns:22px minmax(120px,1.4fr) 78px 78px 58px}
  .colhead .c-comp,.row .chip,.colhead .c-note,.row .rnote{display:none}
}
@media (max-width:620px){
  .wrap{padding:0 16px}
  .masthead{padding:36px 0 20px}
  .colhead,.row{grid-template-columns:22px minmax(0,1fr) 74px 60px}
  .colhead .c-world,.row .c-world{display:none}
  .cluster-sum{display:none}
  .bar-in{gap:10px}
  .maprow{grid-template-columns:1fr;gap:4px}
  .maprow b{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* русская вкладка: колонки «мир» нет */
[data-lang="ru"] .colhead,[data-lang="ru"] .row{
  grid-template-columns:22px minmax(150px,1.5fr) 104px 62px 74px minmax(0,1.35fr)}
[data-lang="ru"] .c-world{display:none}
@media (max-width:900px){
  [data-lang="ru"] .colhead,[data-lang="ru"] .row{grid-template-columns:22px minmax(120px,1.4fr) 78px 58px}
}
@media (max-width:620px){
  [data-lang="ru"] .colhead,[data-lang="ru"] .row{grid-template-columns:22px minmax(0,1fr) 74px 60px}
}
.cluster-all{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:11.5px;
  cursor:pointer;padding:4px 8px;border-radius:8px;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--line)}
.cluster-all:hover{color:var(--accent)}
.cluster-all:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.status{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);font-style:normal;flex:none}
.status.live i{background:var(--accent)}
.status.saving i{background:var(--accent);animation:pulse 1s ease-in-out infinite}

#banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
  border-radius:14px;padding:14px 18px;font-size:13.5px;color:var(--ink-2)}
#banner b{color:var(--ink);font-variant-numeric:tabular-nums}
#banner span{flex:1;min-width:220px}
#banner .btn{background:var(--surface)}

</style>

<script id="app-js">
(function(){
"use strict";
var DATA  = JSON.parse(document.getElementById("app-data").textContent);
var PUB   = JSON.parse(document.getElementById("app-state").textContent);
var LSKEY = "roomora-core-v1";

/* ---------- состояние ---------- */
var local = null;
try { local = JSON.parse(localStorage.getItem(LSKEY) || "null"); } catch(e){}
var state = (local && (local.rev|0) > (PUB.rev|0)) ? local : PUB;
state = { rev: state.rev|0, picked: Array.isArray(state.picked) ? state.picked.slice() : [] };
var picked = new Set(state.picked);

var ui = { lang:"en", q:"", only:false };
try { ui = Object.assign(ui, JSON.parse(sessionStorage.getItem(LSKEY+"-ui") || "{}")); } catch(e){}

var artifact = null, mode = "local", timer = null;

/* ---------- утилиты ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function id(lang,k){ return lang + ":" + k; }
function rows(){ return DATA[ui.lang].rows; }
function visible(r){
  if (ui.only && !picked.has(id(ui.lang, r.k))) return false;
  if (!ui.q) return true;
  var q = ui.q.toLowerCase();
  return r.k.toLowerCase().indexOf(q) >= 0 || (r.n||"").toLowerCase().indexOf(q) >= 0
      || r.c.toLowerCase().indexOf(q) >= 0;
}
var CHECK = '<svg width="11" height="9" viewBox="0 0 11 9" fill="none" aria-hidden="true">'
  + '<path d="M1 4.6L4 7.5L10 1.2" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- отрисовка ---------- */
function ledger(){
  var list = rows(), max = 1, i;
  for (i=0;i<list.length;i++) if (list[i].u > max) max = list[i].u;
  var lg = Math.log10(max + 1);
  var out = [], shown = 0;

  DATA[ui.lang].clusters.forEach(function(cl){
    var items = list.filter(function(r){ return r.c === cl.id && visible(r); });
    if (!items.length) return;
    shown += items.length;
    var sum = 0, npick = 0;
    items.forEach(function(r){ sum += r.u; if (picked.has(id(ui.lang, r.k))) npick++; });
    var allOn = npick === items.length;

    out.push('<section class="cluster"><div class="cluster-head">'
      + '<div class="cluster-letter" aria-hidden="true">' + esc(cl.id.charAt(0)) + '</div>'
      + '<div><h2>' + esc(cl.id.replace(/^[A-Z]\.\s*/, "")) + '</h2><p>' + esc(cl.desc) + '</p>'
      + '<button class="cluster-all" data-all="' + esc(cl.id) + '">'
      + (allOn ? "снять весь кластер" : "выбрать весь кластер") + '</button></div>'
      + '<div class="cluster-sum"><b>' + fmt(sum) + '</b>запросов/мес' + (ui.lang==="en" ? " в США" : "") + '</div>'
      + '</div>');

    out.push('<div class="colhead" aria-hidden="true"><span></span><span>Запрос</span>'
      + '<span class="num c-world">Мир</span>'
      + '<span class="num">' + (ui.lang==="en" ? "США" : "Мир без РФ") + '</span>'
      + '<span class="num">CPC</span><span class="c-comp">Конк.</span><span class="c-note">Заметка</span></div>');

    items.forEach(function(r){
      var key = id(ui.lang, r.k), on = picked.has(key);
      var w = Math.round(Math.log10(r.u + 1) / lg * 100);
      out.push('<div class="row' + (on ? " picked" : "") + '" role="checkbox" tabindex="0"'
        + ' aria-checked="' + on + '" data-k="' + esc(r.k) + '" style="--bar:' + w + '%">'
        + '<span class="box">' + CHECK + '</span>'
        + '<span class="kw">' + esc(r.k) + '</span>'
        + '<span class="num mute c-world">' + (r.w != null ? fmt(r.w) : "") + '</span>'
        + '<span class="num lead">' + fmt(r.u) + '</span>'
        + '<span class="num mute">$' + r.cpc.toFixed(1) + '</span>'
        + '<span class="chip' + (r.comp === "высокая" ? " hi" : "") + '">' + esc(r.comp) + '</span>'
        + '<span class="rnote">' + esc(r.n || "") + '</span></div>');
    });
    out.push('</section>');
  });

  if (!shown) out.push('<div class="empty">Ничего не нашлось. Очистите поиск или снимите фильтр «только выбранные».</div>');
  return out.join("");
}

function tally(){
  var n = 0, v = 0;
  rows().forEach(function(r){ if (picked.has(id(ui.lang, r.k))) { n++; v += r.u; } });
  return { n:n, v:v };
}

function syncTally(){
  var t = tally();
  document.getElementById("tally").innerHTML =
    '<b>' + t.n + '</b> из ' + rows().length + ' ключей<span class="acc">·</span><b class="acc">'
    + fmt(t.v) + '</b> запросов/мес';
}
function syncRowEls(){
  document.querySelectorAll(".row").forEach(function(el){
    var on = picked.has(id(ui.lang, el.dataset.k));
    el.classList.toggle("picked", on);
    el.setAttribute("aria-checked", String(on));
  });
}
function syncButtons(){
  document.querySelectorAll(".cluster-all").forEach(function(b){
    var items = rows().filter(function(r){ return r.c === b.dataset.all && visible(r); });
    var on = items.length > 0 && items.every(function(r){ return picked.has(id(ui.lang, r.k)); });
    b.textContent = on ? "снять весь кластер" : "выбрать весь кластер";
  });
}
/* точечное обновление — не перестраивает список и не теряет фокус клавиатуры */
function softPaint(){ syncRowEls(); syncButtons(); syncTally(); }

function paint(){
  document.documentElement.setAttribute("data-lang", ui.lang);
  document.getElementById("ledger").innerHTML = ledger();
  syncTally();
  document.querySelectorAll(".tab").forEach(function(b){
    b.setAttribute("aria-selected", String(b.dataset.lang === ui.lang)); });
  document.getElementById("only").classList.toggle("on", ui.only);
}

function status(kind){
  var el = document.getElementById("status");
  el.className = "status" + (kind === "saving" ? " saving" : (kind === "live" ? " live" : ""));
  el.innerHTML = '<i></i>' + (
    kind === "saving" ? "сохраняю…" :
    kind === "live"   ? "общая версия — видно всем" :
    kind === "ro"     ? "только у вас — нет прав на общую версию" :
                        "отметки сохранены в этом браузере");
}

/* ---------- сохранение ---------- */
function persist(){
  state.rev = (state.rev|0) + 1;
  state.picked = Array.from(picked);
  try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch(e){}
  try { sessionStorage.setItem(LSKEY+"-ui", JSON.stringify(ui)); } catch(e){}
  if (artifact) { status("saving"); clearTimeout(timer); timer = setTimeout(publish, 2200); }
}

function buildDoc(){
  var css  = document.getElementById("app-css").textContent;
  var js   = document.getElementById("app-js").textContent;
  var data = document.getElementById("app-data").textContent;
  var st   = JSON.stringify(state).replace(/</g, "\\u003c");
  return '<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>Семантическое ядро roomora.ai</title>\n'
    + '<style id="app-css">\n' + css + '\n</style>\n</head>\n<body>\n'
    + '<div id="root"></div>\n'
    + '<script id="app-data" type="application/json">' + data + '<\/script>\n'
    + '<script id="app-state" type="application/json">' + st + '<\/script>\n'
    + '<script id="app-js">\n' + js + '\n<\/script>\n</body>\n</html>';
}

function publish(){
  if (!artifact) return;
  try {
    sessionStorage.setItem(LSKEY+"-scroll", String(window.scrollY));
    sessionStorage.setItem(LSKEY+"-ui", JSON.stringify(ui));
  } catch(e){}
  artifact.publish(buildDoc()).catch(function(err){
    var c = err && err.code;
    if (c === "conflict") return;                       // все вкладки уже перезагружаются
    if (c === "rate_limited") { timer = setTimeout(publish, 5000); return; }
    if (c === "not_writer" || c === "not_granted" || c === "not_declared"
        || c === "capability_disabled" || c === "capability_removed") {
      artifact = null; mode = "ro"; status("ro"); return;
    }
    status("local");
    toast("Общая версия недоступна — отметки сохранены локально");
  });
}

/* ---------- экспорт ---------- */
function csvCell(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
function selectedCsv(){
  var out = [["язык","кластер","запрос","мир","США / мир без РФ","CPC, $","конкуренция","заметка"]
    .map(csvCell).join(",")];
  ["en","ru"].forEach(function(lang){
    DATA[lang].rows.forEach(function(r){
      if (!picked.has(id(lang, r.k))) return;
      out.push([lang === "en" ? "английский" : "русский", r.c, r.k, (r.w != null ? r.w : ""),
        r.u, r.cpc.toFixed(2), r.comp, (r.n || "")].map(csvCell).join(","));
    });
  });
  return out.join("\r\n");
}
function allKeys(){
  return DATA.en.rows.map(function(r){ return "en:" + r.k; })
    .concat(DATA.ru.rows.map(function(r){ return "ru:" + r.k; }));
}
function encodePicks(){
  var all = allKeys(), bytes = new Uint8Array(Math.ceil(all.length / 8));
  all.forEach(function(k, i){ if (picked.has(k)) bytes[i >> 3] |= (1 << (i & 7)); });
  var bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodePicks(s){
  try {
    var bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
    var all = allKeys(), out = new Set();
    all.forEach(function(k, i){
      var b = bin.charCodeAt(i >> 3) || 0;
      if (b & (1 << (i & 7))) out.add(k);
    });
    return out;
  } catch(e){ return null; }
}
function shareUrl(){
  return location.origin + location.pathname + location.search + "#s=" + encodePicks();
}
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");

}

+ 'замену по имени здесь не ищут.</p>'

/* ---------- запуск ---------- */
document.getElementById("root").innerHTML = shell();
document.getElementById("q").value = ui.q;
paint();
status("local");

try {
  var sy = sessionStorage.getItem(LSKEY+"-scroll");
  if (sy) { window.scrollTo(0, parseInt(sy, 10) || 0); sessionStorage.removeItem(LSKEY+"-scroll"); }
} catch(e){}

document.getElementById("ledger").addEventListener("click", function(e){
  var all = e.target.closest(".cluster-all");
  if (all) {
    var cl = all.dataset.all;
    var items = rows().filter(function(r){ return r.c === cl && visible(r); });
    var on = items.every(function(r){ return picked.has(id(ui.lang, r.k)); });
    items.forEach(function(r){ on ? picked.delete(id(ui.lang, r.k)) : picked.add(id(ui.lang, r.k)); });
    persist(); ui.only ? paint() : softPaint(); return;
  }
  var row = e.target.closest(".row");
  if (!row) return;
  var key = id(ui.lang, row.dataset.k);
  picked.has(key) ? picked.delete(key) : picked.add(key);
  persist(); ui.only ? paint() : softPaint();
});
document.getElementById("ledger").addEventListener("keydown", function(e){
  if (e.key !== " " && e.key !== "Enter") return;
  var row = e.target.closest(".row");
  if (!row) return;
  e.preventDefault(); row.click();
});
document.querySelectorAll(".tab").forEach(function(b){
  b.addEventListener("click", function(){ ui.lang = b.dataset.lang;
    try { sessionStorage.setItem(LSKEY+"-ui", JSON.stringify(ui)); } catch(e){}
    paint(); });
});
document.getElementById("q").addEventListener("input", function(e){ ui.q = e.target.value; paint(); });
document.getElementById("only").addEventListener("click", function(){ ui.only = !ui.only; paint(); });

function copyFallback(text){
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(e){ return false; }
}
document.getElementById("copy").addEventListener("click", function(){
  if (!picked.size) { toast("Сначала отметьте ключи галочками"); return; }
  var text = selectedCsv(), n = picked.size;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){
      toast("Скопировано: " + n + " ключей");
    }, function(){
      toast(copyFallback(text) ? "Скопировано: " + n + " ключей"
                               : "Браузер не дал доступ к буферу обмена");
    });
  } else {
    toast(copyFallback(text) ? "Скопировано: " + n + " ключей"
                             : "Браузер не дал доступ к буферу обмена");
  }
});
function linkDownload(csv){
  try {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "roomora-core-selected.csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Файл скачан");
  } catch(e){ toast("Не удалось скачать — используйте «Скопировать»"); }
}
document.getElementById("dl").addEventListener("click", function(){
  if (!picked.size) { toast("Сначала отметьте ключи галочками"); return; }
  var csv = "\ufeff" + selectedCsv();
  if (!window.claude || !claude.use) { linkDownload(csv); return; }
  claude.use("downloads").then(function(d){
    if (!d) { linkDownload(csv); return; }
    return d.save({ filename: "roomora-core-selected.csv", data: csv })
      .then(function(){ toast("Файл сохранён"); })
      .catch(function(err){ if (err && err.code !== "declined") linkDownload(csv); });
  }).catch(function(){ linkDownload(csv); });
});

function mailtoUrl(url, n){
  var to = ["fonderkin", "gmail.com"].join("@");
  return "mailto:" + to
    + "?subject=" + encodeURIComponent("Семантическое ядро roomora.ai — мой выбор")
    + "&body=" + encodeURIComponent("Отметил " + n + " ключей.\n\nСсылка с моим выбором:\n" + url
        + "\n\n(открой её и нажми «Объединить с моим»)");
}
function showDone(url){
  var n = picked.size;
  var el = document.getElementById("banner");
  el.hidden = false;
  el.innerHTML = '<span><b>Готово: ' + n + ' ключей.</b> Ссылка с вашим выбором скопирована — '
    + 'отправьте её Славе в почту или мессенджер. Без этого ваши правки останутся только у вас.</span>';
  var inp = document.createElement("input");
  inp.readOnly = true; inp.value = url;
  inp.style.cssText = "flex:2;min-width:240px;border:1px solid var(--line);border-radius:999px;"
    + "padding:8px 14px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--ink)";
  inp.addEventListener("focus", function(){ inp.select(); });
  el.appendChild(inp);
  var mail = document.createElement("a");
  mail.className = "btn"; mail.textContent = "Написать письмо";
  mail.href = mailtoUrl(url, n);
  mail.style.textDecoration = "none";
  el.appendChild(mail);
  el.scrollIntoView({ block: "center", behavior: "smooth" });
}
document.getElementById("done").addEventListener("click", function(){
  if (!picked.size) { toast("Не отмечено ни одного ключа — снимите лишнее, но что-то оставьте"); return; }
  var url = shareUrl();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function(){ showDone(url); },
                                           function(){ copyFallback(url); showDone(url); });
  } else { copyFallback(url); showDone(url); }
});
function showLink(url){
  var el = document.getElementById("banner");
  el.hidden = false;
  el.innerHTML = '<span>Скопируйте ссылку вручную — браузер не дал доступ к буферу обмена:</span>';
  var inp = document.createElement("input");
  inp.readOnly = true; inp.value = url;
  inp.style.cssText = "flex:2;min-width:260px;border:1px solid var(--line);border-radius:999px;"
    + "padding:8px 14px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--ink)";
  el.appendChild(inp);
  inp.focus(); inp.select();
}

/* выбор, пришедший в ссылке */
function applyHash(){
  var m = /[#&]s=([A-Za-z0-9\-_]+)/.exec(location.hash);
  if (!m) return;
  var incoming = decodePicks(m[1]);
  if (!incoming) return;
  var mine = new Set(picked);
  picked = incoming;
  paint();
  var el = document.getElementById("banner");
  el.hidden = false;
  el.innerHTML = '<span>Открыт выбор из ссылки — <b>' + incoming.size + '</b> ключей.'
    + (mine.size ? ' Ваш прежний выбор (' + mine.size + ') сохранён.' : '') + '</span>'
    + (mine.size ? '<button class="btn" id="merge">Объединить с моим</button>' : '')
    + '<button class="btn" id="keep">Оставить выбор из ссылки</button>';
  var close = function(){ el.hidden = true; history.replaceState(null, "", location.pathname + location.search); };
  if (mine.size) document.getElementById("merge").addEventListener("click", function(){
    mine.forEach(function(k){ picked.add(k); });
    persist(); paint(); close();
    toast("Объединено: " + picked.size + " ключей");
  });
  document.getElementById("keep").addEventListener("click", function(){
    persist(); paint(); close();
  });
}
applyHash();
window.addEventListener("hashchange", applyHash);

if (window.claude && claude.use) {
  claude.use("artifact").then(function(a){
    if (!a) return;
    artifact = a; mode = "shared"; status("live");
  }).catch(function(){});
}
})();
